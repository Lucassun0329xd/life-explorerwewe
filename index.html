function randomItem(array) {
  return array[Math.floor(Math.random() * array.length)];
}

function getZodiacSign(dateString) {

  const date = new Date(dateString + "T00:00:00");
  const month = date.getMonth() + 1;
  const day = date.getDate();

  for (const sign of zodiacSigns) {

    const [startMonth, startDay] = sign.start;
    const [endMonth, endDay] = sign.end;

    if (startMonth === 12 && endMonth === 1) {

      if (
        (month === 12 && day >= startDay) ||
        (month === 1 && day <= endDay)
      ) {
        return sign;
      }

    } else {

      const afterStart =
        month > startMonth ||
        (month === startMonth && day >= startDay);

      const beforeEnd =
        month < endMonth ||
        (month === endMonth && day <= endDay);

      if (afterStart && beforeEnd) {
        return sign;
      }
    }
  }

  return zodiacSigns[0];
}

function getChineseZodiac(year) {

  const index = (year - 2020) % 12;
  const fixedIndex = (index + 12) % 12;

  return chineseZodiac[fixedIndex];
}

async function increaseVisitorCount() {

  const { data, error } =
    await supabaseClient.rpc("increment_quiz_count");

  if (error) {
    console.error("計數失敗：", error);
    return;
  }

  if (data !== null) {
    visitorCount.textContent = data;
  }
}

async function loadVisitorCount() {

  const { data, error } =
    await supabaseClient
      .from("quiz_stats")
      .select("count")
      .eq("id", 1)
      .single();

  if (error) {
    console.error("讀取計數失敗：", error);
    return;
  }

  visitorCount.textContent = data.count;
}
